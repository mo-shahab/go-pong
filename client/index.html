<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ping Pong Game - SPA</title>
  <link rel="stylesheet" href="styles/index.css" />
</head>
<body>
  <div id="app">
    
    <!-- Room Management View -->
    <div id="room-management" class="card">
      <h1>Ping Pong Game</h1>
      <button id="create-room" class="action-button">Create Room</button>
      <details id="join-section" class="join-section">
        <summary class="action-button">Join Room</summary>
        <div class="input-group">
          <input id="room-code-input" class="room-input" placeholder="Room Code (e.g., ABCD12)" />
          <button id="join-room" class="action-button">Join</button>
        </div>
      </details>
      <div id="room-code-display" class="room-code"></div>
      <div id="status" class="status"></div>
    </div>

    <!-- Game View -->
    <div id="game-container" style="display: none;">
      <!-- Game Info Header -->
      <div class="game-info">
        <div class="room-code" id="room-code-display">Room Code: Loading...</div>
        <div class="status" id="status-display">Connecting...</div>
        <div class="player-count" id="player-count-display">Players: 0 / 0</div>
      </div>

      <!-- Game Play Area -->
      <div class="game-play-area">
        <!-- Left Player List -->
        <div class="player-list-left">
          <h3>Left Team</h3>
          <div id="left-players">
            <p>Waiting for players...</p>
          </div>
        </div>

        <!-- Canvas Container -->
        <div class="canvas-container">
          <canvas id="game-canvas"></canvas>
        </div>

        <!-- Right Player List -->
        <div class="player-list-right">
          <h3>Right Team</h3>
          <div id="right-players">
            <p>Waiting for players...</p>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Import TS modules -->
  <script type="module" src="./src/main.ts"></script>
  <script type="module" src="./src/game.ts"></script>
</body>
</html>
